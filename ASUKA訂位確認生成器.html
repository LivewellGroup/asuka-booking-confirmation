<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASUKA 訂位確認生成器 · Livewell Travel 艾旅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ═══ 工具介面樣式(Brand Guideline 2026)═══ */
  :root {
    --green: #526B52; --green-dk: #40523F; --green-lt: #E6EEEB;
    --cream: #F4F0E7; --ink: #151917; --muted: #6D6A62;
    --line: #D8D1C2; --gold: #C8A35C; --gold-dk: #8F6E33; --gold-bg: #F5EDDD;
    --seaglass: #B8D3CE; --stone: #CEC6B8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', 'Noto Sans TC', 'Segoe UI', 'Microsoft JhengHei', sans-serif;
    background: var(--cream); color: var(--ink); height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  header.topbar {
    background: var(--green); color: #F4F0E7; padding: 10px 20px;
    display: flex; align-items: center; gap: 16px; flex-shrink: 0;
  }
  .topbar .brand-logo { height: 34px; display: block; }
  .topbar h1 { font-size: 15px; font-weight: 500; letter-spacing: 1px; }
  .topbar .sub { font-size: 10.5px; opacity: .7; letter-spacing: 2.5px; text-transform: uppercase; }
  .topbar .spacer { flex: 1; }
  .topbar button {
    background: transparent; color: #F4F0E7; border: 1px solid rgba(244,240,231,.45);
    padding: 7px 14px; font-size: 13px; cursor: pointer; border-radius: 0; letter-spacing: 1px;
    font-family: inherit;
  }
  .topbar button:hover { background: rgba(244,240,231,.15); }
  .topbar button.primary { background: var(--gold); border-color: var(--gold); color: var(--ink); font-weight: 600; }
  .topbar button.primary:hover { background: #D4B472; }
  main { flex: 1; display: flex; min-height: 0; }
  /* ── 左側表單 ── */
  #formPanel {
    width: 430px; flex-shrink: 0; overflow-y: auto; background: #fff;
    border-right: 1px solid var(--line); padding: 14px 16px 60px;
  }
  details.sec { border: 1px solid var(--line); border-radius: 4px; margin-bottom: 10px; background: #fff; }
  details.sec > summary {
    cursor: pointer; padding: 10px 12px; font-size: 14px; font-weight: 600; color: var(--green-dk);
    background: var(--green-lt); border-radius: 3px; list-style: none; display: flex; align-items: center; gap: 8px;
    user-select: none;
  }
  details.sec > summary::before { content: "▸"; font-size: 11px; transition: transform .15s; }
  details.sec[open] > summary::before { transform: rotate(90deg); }
  details.sec .body { padding: 12px; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; letter-spacing: .5px; }
  .field input[type=text], .field input[type=date], .field textarea, .field select {
    width: 100%; padding: 7px 9px; font-size: 13.5px; border: 1px solid var(--line); border-radius: 3px;
    font-family: inherit; color: var(--ink); background: #fff;
  }
  .field textarea { resize: vertical; min-height: 56px; line-height: 1.6; }
  .field input:focus, .field textarea:focus, .field select:focus { outline: 2px solid var(--green-lt); border-color: var(--green); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .checkline { display: flex; align-items: center; gap: 7px; font-size: 13.5px; padding: 4px 0; cursor: pointer; }
  .checkline input { width: 15px; height: 15px; accent-color: var(--green); }
  .hint { font-size: 11.5px; color: var(--muted); line-height: 1.5; margin-top: 4px; }
  /* 動態列表 */
  .list-item {
    border: 1px solid var(--line); border-left: 3px solid var(--green); border-radius: 3px;
    padding: 9px 10px 4px; margin-bottom: 8px; position: relative; background: #FCFBF8;
  }
  .list-item .del {
    position: absolute; top: 6px; right: 6px; border: none; background: none; color: #B85042;
    font-size: 15px; cursor: pointer; line-height: 1; padding: 3px 5px;
  }
  .list-item .del:hover { background: #F7E8E5; border-radius: 3px; }
  button.add {
    width: 100%; padding: 7px; border: 1px dashed var(--green); background: none; color: var(--green-dk);
    font-size: 13px; cursor: pointer; border-radius: 3px; font-family: inherit;
  }
  button.add:hover { background: var(--green-lt); }
  .statusToggle { display: flex; gap: 0; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .statusToggle button {
    flex: 1; padding: 10px; font-size: 14px; font-weight: 700; border: none; background: #fff;
    cursor: pointer; color: var(--muted); font-family: inherit; letter-spacing: 2px;
  }
  .statusToggle button.on-paid { background: var(--green); color: #fff; }
  .statusToggle button.on-unpaid { background: var(--gold-dk); color: #fff; }
  /* ── 右側預覽 ── */
  #previewPanel { flex: 1; overflow: auto; padding: 24px; display: flex; justify-content: center; }
  #frameBox { transform-origin: top center; }
  #previewFrame {
    width: 210mm; border: none; background: #fff;
    box-shadow: 0 4px 24px rgba(0,0,0,.18);
  }
</style>
</head>
<body>
<header class="topbar">
  <img id="topbarLogo" class="brand-logo" alt="Livewell Travel">
  <div>
    <h1>ASUKA 訂位確認生成器</h1>
    <div class="sub">Booking Confirmation</div>
  </div>
  <div class="spacer"></div>
  <button id="btnReset">重設範例</button>
  <button id="btnLoad">載入 JSON</button>
  <button id="btnSave">儲存 JSON</button>
  <button id="btnPdf" class="primary">下載 PDF</button>
  <input type="file" id="fileInput" accept=".json" style="display:none">
</header>
<main>
  <div id="formPanel"></div>
  <div id="previewPanel"><div id="frameBox"><iframe id="previewFrame" title="A4 預覽"></iframe></div></div>
</main>

/** 相容舊版資料:舊取消規定格式(period/penaltyRate/description)轉為中英對照欄位 */
function normalizeData(d) {
  if (Array.isArray(d.penaltySchedule)) {
    d.penaltySchedule = d.penaltySchedule.map(p => p && "period" in p
      ? { periodEn: "", periodZh: p.period || "", feeEn: p.penaltyRate || "", feeZh: p.description || "" }
      : p);
  }
  // 文件會自動在航程名稱前加船名;若舊資料的航程名稱已手動含船名,去除重複
  if (d.shipName && d.routeName && d.routeName.startsWith(d.shipName)) {
    d.routeName = d.routeName.slice(d.shipName.length).replace(/^[\s・‧·．.、–-]+/, "");
  }
  // 舊版重要提醒預設文字 → 換成新版預設(僅在使用者未自行修改過時)
  if (d.penaltyNoticeEn === "Due to the extremely strict payment terms, cancellation or changes, refunds, and other regulations when booking international cruise ships, this reservation is not subject to the provisions of the Taiwan Tourism Bureau's announced travel contract regarding passengers' voluntary termination of the contract before departure.") {
    d.penaltyNoticeEn = DEFAULT_DATA.penaltyNoticeEn;
  }
  if (d.penaltyNoticeZh === "由於國際郵輪訂位之付款條件相對嚴格，包含取消、變更、退款及其他相關規範，皆依上列規定辦理。本訂單不適用台灣觀光署公告之旅遊定型化契約之相關規定。") {
    d.penaltyNoticeZh = DEFAULT_DATA.penaltyNoticeZh;
  }
  // 重要提醒文字內容與預設相同、僅換行/空白不同 → 統一為預設排版
  const flatTxt = (t) => String(t || "").replace(/\s+/g, "");
  if (flatTxt(d.penaltyNoticeEn) === flatTxt(DEFAULT_DATA.penaltyNoticeEn)) d.penaltyNoticeEn = DEFAULT_DATA.penaltyNoticeEn;
  if (flatTxt(d.penaltyNoticeZh) === flatTxt(DEFAULT_DATA.penaltyNoticeZh)) d.penaltyNoticeZh = DEFAULT_DATA.penaltyNoticeZh;
  // 舊版單行公司名稱預設值 → 換成新的中英兩行預設
  // 舊版地址預設值 → 2026-08-05 更新的完整地址(僅在使用者未自行修改時遷移)
  if (d.companyAddress === "106485 台北市大安區敦化南路二段 76 號 2 樓之 2") {
    d.companyAddress = DEFAULT_DATA.companyAddress;
  }
  if (d.companyName === "艾旅 LIVEWELL") {
    d.companyName = "艾旅國際旅行社";
    d.companyNameEn = d.companyNameEn || "LIVEWELL GROUP LTD.";
  }
  return d;
}
function loadInitial() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return normalizeData(Object.assign(structuredClone(DEFAULT_DATA), JSON.parse(raw)));
  } catch (e) { /* 忽略壞資料 */ }
  return structuredClone(DEFAULT_DATA);
}

/* ═══════════════ 工具函式 ═══════════════ */
const esc = (t) => String(t ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const s = (v, fb = "") => (v === null || v === undefined || String(v).trim() === "") ? fb : esc(v);
const nl2br = (t) => esc(t).replace(/\n/g, "<br>");
const pad2 = (n) => String(n).padStart(2, "0");
const fmtAmt = (n) => Number(n || 0).toLocaleString("en-US", { maximumFractionDigits: 0 });
const fmtMoney = (cur, n) => `${cur} ${fmtAmt(n)}`;
const fmtDate = (d) => {
  if (!d) return "—";
  const m = String(d).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? `${m[1]} 年 ${Number(m[2])} 月 ${Number(m[3])} 日` : esc(d);
};
/** 日期斜線格式,如「2026/06/26」;格式不符原樣輸出 */
const fmtSlash = (d) => {
  if (!d) return "—";
  const m = String(d).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? `${m[1]}/${m[2]}/${m[3]}` : esc(d);
};
/** 日期(YYYY-MM-DD)往前推 n 天;格式不符回傳空字串 */
const dateMinusDays = (d, n) => {
  const m = String(d || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return "";
  const dt = new Date(Date.UTC(Number(m[1]), Number(m[2]) - 1, Number(m[3]) - n));
  return `${dt.getUTCFullYear()}-${pad2(dt.getUTCMonth() + 1)}-${pad2(dt.getUTCDate())}`;
};
/** 日期含星期,如「2026 年 5 月 12 日（二）」 */
const fmtDateW = (d) => {
  const m = String(d || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return "—";
  const dt = new Date(Date.UTC(Number(m[1]), Number(m[2]) - 1, Number(m[3])));
  return `${fmtDate(d)}（${["日", "一", "二", "三", "四", "五", "六"][dt.getUTCDay()]}）`;
};

/** 各幣別 應收/已收/餘額 */
function computeTotals(items) {
  const t = {};
  for (const it of items || []) {
    const cur = it.currency || "JPY";
    if (!t[cur]) t[cur] = { charge: 0, received: 0 };
    const amt = Number(it.amount) || 0;
    if (it.received) t[cur].received += amt; else t[cur].charge += amt;
  }
  for (const cur of Object.keys(t)) t[cur].balance = t[cur].charge - t[cur].received;
  return t;
}

function renderDocument(d, forceSplitAmount = false) {
  const totals = computeTotals(d.priceItems);
  const curList = Object.keys(totals);
  const unpaid = d.status !== "paid";
  const guestMain = (d.guests && d.guests[0] && (d.guests[0].nameZh || d.guests[0].nameEn)) || "貴賓";

  let pageNo = 0;

    pageNo += 1;
    return `

      ${body}
      <div class="pf">
        <span class="pf-left">Booking Confirmation · ${esc(guestMain)}</span>
        <span class="pf-num">${pad2(pageNo)}</span>
      </div>
    </section>`;
  };
  const sectionTitle = (eyebrow, title) => `
    <div class="eyebrow">${eyebrow}</div>
    <h2 class="sec-title">${title}</h2>`;

  const pages = [];

  /* ── 第 1 頁:訂位確認 ── */
  const statusStrip = unpaid
    ? `<div class="status-strip unpaid"><span class="st">待付款 Option</span>${d.paymentDueDate ? `<span class="due">付款到期日<strong>${fmtDate(d.paymentDueDate)}</strong></span>` : ""}</div>`
    : `<div class="status-strip paid"><span class="st">Booking · 已付款</span><span class="due">感謝您的付款，本訂位已確認。</span></div>`;

  // 已付款狀態:已收款項照一般項目呈現(保留「(已收)」字樣,不加負號)
  const amtRows = (d.priceItems || []).map(it => `
    <tr${(it.received && unpaid) ? ` class="received"` : ""}>
      <td>${s(it.label, "—")}${it.received ? "（已收）" : ""}</td>
      <td class="c">${s(it.currency, "JPY")}</td>
      <td class="r money">${fmtAmt(it.amount)}</td>
    </tr>`).join("");

  // 待付款且有已收金額時,顯示 總計/已收金額/應付餘款 三列;
  // 已付款時只列總計(全部項目加總)。標籤用中文四字寬對齊,金額僅帶幣別符號;多幣別時於總計標籤註記幣別。
  const plainMoney = fmtMoney;
  const totalBlocks = `<div class="amt-totals">${curList.map(cur => {
    const t = totals[cur];
    if (!unpaid) {
      return `<div class="trow total"><span class="k">總　計</span><span class="v">${plainMoney(cur, t.charge + t.received)}</span></div>`;
    }
    let rows = `<div class="trow total"><span class="k">總　計</span><span class="v">${plainMoney(cur, t.charge)}</span></div>`;
    if (t.received > 0) {
      rows += `<div class="trow"><span class="k">已收金額</span><span class="v">${plainMoney(cur, t.received)}</span></div>`;
      if (t.balance > 0) rows += `<div class="trow balance"><span class="k">應付餘款</span><span class="v">${plainMoney(cur, t.balance)}</span></div>`;
    }
    return rows;
  }).join("")}</div>`;

  const vmRow = (label, valueHtml) => `<div class="vm"><span class="label">${label}</span><span class="v">${valueHtml}</span></div>`;
  const kvRow = (label, valueHtml) => `<div class="kv-row"><span class="label">${label}</span>${valueHtml}</div>`;

// 內嵌於文件本身,預覽 iframe、列印視窗、另存的 HTML 都適用;字型載入後與列印前會再各檢查一次。
(function () {
  function overflows() {
    var flow = document.getElementById("amountFlow");
    if (!flow || flow.style.display === "none") return false;
    var page = flow.closest(".page");
    var pf = page && page.querySelector(".pf");
    if (!pf) return false;
    return flow.getBoundingClientRect().bottom > pf.getBoundingClientRect().top - 2;
  }
  function renumber() {
    var pages = document.querySelectorAll(".page");
    var n = 0;
    for (var i = 0; i < pages.length; i++) {
      if (pages[i].style.display === "none") continue;
      n++;
      var num = pages[i].querySelector(".pf-num");
      if (num) num.textContent = (n < 10 ? "0" + n : String(n));
    }
  }
  function decide() {
    var flow = document.getElementById("amountFlow");
    var alt = document.querySelector(".amt-alt");
    if (!flow || !alt || flow.style.display === "none") return;
    if (overflows()) {
      flow.style.display = "none";
      alt.style.display = "";
      renumber();
    }
  }
  decide();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { setTimeout(decide, 0); });
  window.addEventListener("beforeprint", decide);
})();
<\/script>
</body>
</html>`;
}

/* ═══════════════ 表單 UI ═══════════════ */
const formPanel = document.getElementById("formPanel");

function fld(label, path, opts = {}) {
  const v = getPath(path);
  const type = opts.type || "text";
  if (type === "textarea")
    return `<div class="field"><label>${label}</label><textarea data-bind="${path}"${opts.rows ? ` rows="${opts.rows}"` : ""}>${esc(v)}</textarea></div>`;
  return `<div class="field"><label>${label}</label><input type="${type}" data-bind="${path}" value="${esc(v)}"></div>`;
}
function check(label, path) {
  return `<label class="checkline"><input type="checkbox" data-bind="${path}"${getPath(path) ? " checked" : ""}> ${label}</label>`;
}
function getPath(path) {
  return path.split(".").reduce((o, k) => (o == null ? o : o[/^\d+$/.test(k) ? Number(k) : k]), data);
}
function setPath(path, value) {
  const keys = path.split(".");
  let o = data;
  for (let i = 0; i < keys.length - 1; i++) o = o[/^\d+$/.test(keys[i]) ? Number(keys[i]) : keys[i]];
  const last = keys[keys.length - 1];
  o[/^\d+$/.test(last) ? Number(last) : last] = value;
}

function bankFields(prefix) {
  return `
    ${fld("卡片標題", prefix + ".title")}
    ${fld("匯款金額(留空＝自動帶入明細該幣別餘額)", prefix + ".amount", { type: "text" })}
    ${fld("BANK 銀行名稱", prefix + ".bankName")}
    ${fld("BRANCH 分行名稱", prefix + ".branchName")}
    ${fld("ACCOUNT NAME 戶名", prefix + ".accountName")}
    <div class="row2">
      ${fld("SWIFT CODE", prefix + ".swiftCode")}
      ${fld("ACCOUNT NUMBER 帳號", prefix + ".accountNo")}
    </div>
    ${fld("REFERENCE 備註(留空不顯示)", prefix + ".reference")}`;
}

      ${fld("航程名稱(日文)", "routeName")}
      <div class="row3">
        ${fld("出發日期", "departureDate", { type: "date" })}
        ${fld("回程日期", "returnDate", { type: "date" })}
        ${fld("天數", "duration")}
      </div>
    </div>
  </details>

  <details class="sec" data-sec="cabin" ${secOpen("cabin", false) ? "open" : ""}>
    <summary>房型</summary>
    <div class="body">
      <div class="row2">
        ${fld("房型(中文)", "cabinName")}
        ${fld("房型(英文)", "cabinNameEn")}
      </div>
      <div class="row2">
        ${fld("艙房號(留空顯示「待分配」)", "cabinNo")}
        ${fld("入住人數", "occupancy")}
      </div>
    </div>
  </details>

  <details class="sec" data-sec="guests" ${secOpen("guests", false) ? "open" : ""}>
    <summary>訂位人(${(data.guests || []).length} 位)</summary>
    <div class="body">
      ${(data.guests || []).map((g, i) => `
        <div class="list-item">
          <button type="button" class="del" data-del-guest="${i}" title="刪除">✕</button>
          <div class="row2">
            ${fld("姓名(中文)", `guests.${i}.nameZh`)}
            ${fld("護照英文名", `guests.${i}.nameEn`)}
          </div>
        </div>`).join("")}
      <button type="button" class="add" id="addGuest">＋ 新增訂位人</button>
    </div>
  </details>

  <details class="sec" data-sec="amount" ${secOpen("amount", true) ? "open" : ""}>
    <summary>金額</summary>
    <div class="body">
      ${(data.priceItems || []).map((it, i) => `
        <div class="list-item">
          <button type="button" class="del" data-del-item="${i}" title="刪除">✕</button>
          ${fld("項目", `priceItems.${i}.label`)}
          <div class="row3">
            <div class="field"><label>幣別</label>
              <select data-bind="priceItems.${i}.currency">
                <option value="JPY"${it.currency === "JPY" ? " selected" : ""}>JPY 日幣</option>
                <option value="NTD"${it.currency === "NTD" ? " selected" : ""}>NTD 台幣</option>
              </select>
            </div>
            ${fld("金額", `priceItems.${i}.amount`, { type: "text" })}
            <div class="field"><label>性質</label>
              <select data-bind="priceItems.${i}.received" data-boolean="1">
                <option value=""${!it.received ? " selected" : ""}>應收費用</option>
                <option value="1"${it.received ? " selected" : ""}>已收款項</option>
              </select>
            </div>
          </div>
        </div>`).join("")}
      <button type="button" class="add" id="addItem">＋ 新增金額項目</button>
      <div class="hint">「已收款項」會以負項顯示並自動計算應付餘額;各幣別分開加總。</div>
      ${fld("金額備註", "amountNote", { type: "textarea" })}
      ${fld("其他備註(留空不顯示)", "notes", { type: "textarea" })}
    </div>
  </details>

  <details class="sec" data-sec="payment" ${secOpen("payment", data.status !== "paid") ? "open" : ""}>
    <summary>付款資訊(Option · 待付款時輸出)</summary>
    <div class="body">
      ${check("顯示日幣匯款帳戶", "showJpyBank")}
      ${check("顯示台幣匯款帳戶", "showTwdBank")}
      ${check("附上刷卡授權單(台幣)", "includeCcNtd")}
      <div class="hint">已付款狀態下,以上頁面一律不會輸出。<br>若要讓客人自選付款幣別,請在下方各帳戶內容分別填入日幣/台幣匯款金額(留空則自動帶入明細表該幣別餘額)。</div>
      <hr style="border:none;border-top:1px solid var(--line);margin:10px 0;">
      <details class="sec" data-sec="bankJpy" ${secOpen("bankJpy", false) ? "open" : ""}>
        <summary style="font-size:13px;">日幣帳戶內容</summary>
        <div class="body">${bankFields("bankJpy")}</div>
      </details>
      <details class="sec" data-sec="bankTwd" ${secOpen("bankTwd", false) ? "open" : ""}>
        <summary style="font-size:13px;">台幣帳戶內容</summary>
        <div class="body">${bankFields("bankTwd")}</div>
      </details>
      ${fld("刷卡金額(台幣,留空＝自動帶入明細台幣餘額)", "ccAmountNtd", { type: "text" })}
      ${fld("刷卡授權單金額備註(選填,填了會覆蓋上方金額)", "ccAuthNoteNtd", { type: "textarea", rows: 2 })}
    </div>
  </details>

  <details class="sec" data-sec="penalty" ${secOpen("penalty", false) ? "open" : ""}>
    <summary>取消規定</summary>
    <div class="body">
      ${(data.penaltySchedule || []).map((p, i) => `
        <div class="list-item">
          <button type="button" class="del" data-del-pen="${i}" title="刪除">✕</button>
          <div class="row2">
            ${fld("取消日期(英文)", `penaltySchedule.${i}.periodEn`)}
            ${fld("取消日期(中文)", `penaltySchedule.${i}.periodZh`)}
          </div>
          <div class="row2">
            ${fld("取消費用(英文)", `penaltySchedule.${i}.feeEn`)}
            ${fld("取消費用(中文)", `penaltySchedule.${i}.feeZh`)}
          </div>
        </div>`).join("")}
      <button type="button" class="add" id="addPen">＋ 新增取消費用階段</button>
      ${fld("重要提醒(英文)", "penaltyNoticeEn", { type: "textarea", rows: 6 })}
      ${fld("重要提醒(中文)", "penaltyNoticeZh", { type: "textarea", rows: 4 })}
    </div>
  </details>

  <details class="sec" data-sec="schedule" ${secOpen("schedule", false) ? "open" : ""}>
    <summary>日程表(出發前預選開放日)</summary>
    <div class="body">
      ${check("輸出日程表頁", "includeSchedule")}
      <div class="hint">日期由「出發日期」自動往前推算,只需填天數;修改出發日期後日程會自動更新。</div>
      ${(data.scheduleItems || []).map((it, i) => `
        <div class="list-item">
          <button type="button" class="del" data-del-sch="${i}" title="刪除">✕</button>
          ${fld("項目(中文)", `scheduleItems.${i}.label`)}
          <div class="row2">
            ${fld("項目(英文,留空不顯示)", `scheduleItems.${i}.sub`)}
            ${fld("出發前天數", `scheduleItems.${i}.daysBefore`, { type: "number" })}
          </div>
        </div>`).join("")}
      <button type="button" class="add" id="addSch">＋ 新增日程項目</button>
      ${fld("日程備註(留空不顯示)", "scheduleNote", { type: "textarea", rows: 3 })}
    </div>
  </details>

  <details class="sec" data-sec="company" ${secOpen("company", false) ? "open" : ""}>
    <summary>公司資訊</summary>
    <div class="body">
      <div class="row2">
        ${fld("公司名稱(中文)", "companyName")}
        ${fld("公司名稱(英文)", "companyNameEn")}
      </div>
      ${fld("地址", "companyAddress")}
      ${fld("註冊證號(交觀甲/品保,留空不顯示)", "companyLicense")}
      <div class="row2">
        ${fld("電話", "companyPhone")}
        ${fld("網站", "companyWebsite")}
      </div>
    </div>
  </details>`;

  if (wasEmpty) { /* 首次渲染無需恢復展開狀態 */ }

  // 事件綁定
  document.getElementById("btnPaid").onclick = () => { data.status = "paid"; refresh(true); };
  document.getElementById("btnUnpaid").onclick = () => { data.status = "unpaid"; refresh(true); };
  document.getElementById("addGuest").onclick = () => { data.guests.push({ nameZh: "", nameEn: "" }); refresh(true); };
  document.getElementById("addItem").onclick = () => { data.priceItems.push({ label: "", currency: "JPY", amount: 0, received: false }); refresh(true); };
  document.getElementById("addPen").onclick = () => { data.penaltySchedule.push({ periodEn: "", periodZh: "", feeEn: "", feeZh: "" }); refresh(true); };
  document.getElementById("addSch").onclick = () => { data.scheduleItems.push({ label: "", sub: "", daysBefore: 0 }); refresh(true); };
  formPanel.querySelectorAll("[data-del-guest]").forEach(b => b.onclick = () => { data.guests.splice(Number(b.dataset.delGuest), 1); refresh(true); });
  formPanel.querySelectorAll("[data-del-item]").forEach(b => b.onclick = () => { data.priceItems.splice(Number(b.dataset.delItem), 1); refresh(true); });
  formPanel.querySelectorAll("[data-del-pen]").forEach(b => b.onclick = () => { data.penaltySchedule.splice(Number(b.dataset.delPen), 1); refresh(true); });
  formPanel.querySelectorAll("[data-del-sch]").forEach(b => b.onclick = () => { data.scheduleItems.splice(Number(b.dataset.delSch), 1); refresh(true); });
}

// 輸入事件(委派)
formPanel.addEventListener("input", (e) => {
  const el = e.target;
  const path = el.dataset.bind;
  if (!path) return;
  let val;
  if (el.type === "checkbox") val = el.checked;
  else if (el.dataset.boolean) val = el.value === "1";
  else val = el.value;
  if (path.startsWith("priceItems.") && path.endsWith(".amount")) {
    val = Number(String(val).replace(/[,，\s]/g, "")) || 0;
  }
  setPath(path, val);
  schedulePreview();
  scheduleStore();
});

/* ═══════════════ 預覽/儲存 ═══════════════ */
const previewFrame = document.getElementById("previewFrame");
let previewTimer = null, storeTimer = null;

function renderPreview() {
  const doc = previewFrame.contentDocument;
  doc.open(); doc.write(renderDocument(data)); doc.close();
  // iframe 高度 = 文件頁數;文件內嵌腳本可能在字型載入後多拆出一頁,故延後再各重算一次
  const finish = () => {
    try { previewFrame.style.height = doc.body.scrollHeight + "px"; } catch (e) {}
    fitPreview();
  };
  setTimeout(finish, 80);
  try { doc.fonts.ready.then(() => setTimeout(finish, 100)); } catch (e) {}
}
function schedulePreview() { clearTimeout(previewTimer); previewTimer = setTimeout(renderPreview, 600); }
function scheduleStore() {
  clearTimeout(storeTimer);
  storeTimer = setTimeout(() => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {} }, 800);
}
function refresh(rerenderForm) {
  if (rerenderForm) renderForm();
  schedulePreview();
  scheduleStore();
}

// 預覽縮放
function fitPreview() {
  const panel = document.getElementById("previewPanel");
  const box = document.getElementById("frameBox");
  const a4px = 210 * 96 / 25.4; // 210mm → px
  const avail = panel.clientWidth - 48;
  const scale = Math.min(1, avail / a4px);
  box.style.transform = `scale(${scale})`;
  box.style.height = (previewFrame.offsetHeight * scale) + "px";
}
window.addEventListener("resize", fitPreview);

/* ═══════════════ 工具列 ═══════════════ */
document.getElementById("btnPdf").onclick = () => {
  const w = window.open("", "_blank");
  if (!w) { alert("請允許彈出視窗以下載 PDF"); return; }
  w.document.open(); w.document.write(renderDocument(data)); w.document.close();
  // 等字型與版面載入後叫出列印(另存 PDF);分頁由文件內嵌腳本實測處理,列印前亦會再檢查一次
  setTimeout(() => { try { w.focus(); w.print(); } catch (e) {} }, 900);
};
document.getElementById("btnSave").onclick = () => {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `ASUKA訂位確認_${(data.guests && data.guests[0] && data.guests[0].nameZh) || data.routeName || "未命名"}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
};
document.getElementById("btnLoad").onclick = () => document.getElementById("fileInput").click();
document.getElementById("fileInput").addEventListener("change", (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      data = normalizeData(Object.assign(structuredClone(DEFAULT_DATA), JSON.parse(r.result)));
      refresh(true);
    } catch (err) { alert("JSON 格式錯誤,無法載入。"); }
  };
  r.readAsText(f);
  e.target.value = "";
});
document.getElementById("btnReset").onclick = () => {
  if (!confirm("確定要清除目前內容,回到範例資料嗎?")) return;
  data = structuredClone(DEFAULT_DATA);
  localStorage.removeItem(STORAGE_KEY);
  refresh(true);
};

/* ═══════════════ 啟動 ═══════════════ */
document.getElementById("topbarLogo").src = LOGO_H_WHITE;
(function () {
  const fav = document.createElement("link");
  fav.rel = "icon"; fav.type = "image/png"; fav.href = SEAL_GREEN;
  document.head.appendChild(fav);
})();
renderForm();
renderPreview();
setTimeout(fitPreview, 200);
</script>
</body>
</html>
